      title: "Tâches"
      new_task: "Nouvelle tâche"
      no_tasks: "Aucune tâche pour le moment."
      confirm_destroy: "Êtes-vous sûr de vouloir supprimer cette tâche ?"
    new:
      title: "Nouvelle tâche"
    edit:
      title: "Modifier la tâche"
    form:
      save: "Enregistrer"
      cancel: "Annuler"
      back: "Retour"

  flash:
    tasks:
      create:
        notice: "La tâche a été créée avec succès."
      update:
        notice: "La tâche a été mise à jour avec succès."
      destroy:
        notice: "La tâche a été supprimée avec succès."
      failure:
        alert: "La tâche n'a pas pu être enregistrée."